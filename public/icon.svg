<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 배경 사각형 (앱 아이콘 모던 라운딩) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 은은한 보조 궤도 링 -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Edu-Pathfinder 공식 심볼 (중심 정렬 스케일) -->
  <g transform="translate(94, 94) scale(13.5)" filter="url(#shadow)">
    <!-- 1. 외곽 기하학 다이아몬드 프레임 -->
    <path
      d="M12 2.8L14.6 9.4L21.2 12L14.6 14.6L12 21.2L9.4 14.6L2.8 12L9.4 9.4L12 2.8Z"
      fill="#ffffff"
      fill-opacity="0.22"
      stroke="#ffffff"
      stroke-width="1.6"
      stroke-linejoin="round"
    />
    <!-- 2. 내부 중심 코어 비콘 -->
    <path
      d="M12 6.8L13.6 10.4L17.2 12L13.6 13.6L12 17.2L10.4 13.6L6.8 12L10.4 10.4L12 6.8Z"
      fill="url(#core)"
    />
    <!-- 3. 정밀 가이드 포인트 -->
    <circle cx="12" cy="12" r="1.3" fill="#4338ca" />
    <circle cx="12" cy="12" r="0.6" fill="#ffffff" />
  </g>
</svg>
